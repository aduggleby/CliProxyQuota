name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test quota readers and API compatibility
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CliProxy-Quota-macOS
          path: build/*.app
